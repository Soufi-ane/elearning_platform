
<div class="h-dvh flex bg-[#0E1A14] pt-12 text-[#EAE3D5] font-['DM_Sans',sans-serif]">

  <aside class="w-60 flex flex-col bg-[#0B1610] border-r border-[#2A3D30]">

    <div class="px-4 pt-8 pb-6 border-b border-[#2A3D30] space-y-1">
      <a class="flex mt-3 items-center gap-3 px-2 py-2 text-sm text-[#C8A96E]
        border-l-2 border-[#C8A96E] bg-[#1A3025] cursor-pointer">
        <svg class="w-4 h-4 opacity-100" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" stroke="currentColor" stroke-width="1.2"/>
          <rect x="9" y="1" width="6" height="6" stroke="currentColor" stroke-width="1.2"/>
          <rect x="1" y="9" width="6" height="6" stroke="currentColor" stroke-width="1.2"/>
          <rect x="9" y="9" width="6" height="6" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Overview
      </a>

      <a routerLink="calendar"
        class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
          border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
          cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="2" width="14" height="13" rx="1"
            stroke="currentColor" stroke-width="1.2"/>
          <path d="M1 6h14" stroke="currentColor" stroke-width="1.2"/>
          <path d="M5 1v2M11 1v2" stroke="currentColor"
            stroke-width="1.2" stroke-linecap="round"/>
          <path d="M4 9h2M7 9h2M10 9h2M4 12h2M7 12h2M10 12h2"
            stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Calendar
      </a>
      <a routerLink="attendance"
        class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
          border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
          cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M3 13.5c0-2 2-3.5 5-3.5s5 1.5 5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M12 2l2 2M14 2l-2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Attendance
      </a>
      <a routerLink="requests"
         class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
           border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
           cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h10a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0
          0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5v-8z"
          stroke="currentColor" stroke-width="1.2"/>
          <path d="M5 8h6M5 11h3"
          stroke="currentColor" stroke-width="1.2"
          stroke-linecap="round"/>
          <path d="M12 2v4m0 0l-1.5-1.5M12 6l1.5-1.5"
          stroke="currentColor" stroke-width="1.2"
          stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Requests
      </a>
      <a routerLink="grades"
        class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
        border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
        cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <path d="M13 11l-4-7-4 7" stroke="currentColor"
            stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 9h3" stroke="currentColor"
            stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Grades
      </a>
      <a routerLink="modules"
         routerLinkActive="text-[#C8A96E] border-[#C8A96E] bg-[#1A3025]"
         class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
           border-l-2 border-transparent hover:text-[#EAE3D5]
           hover:bg-[#1A3025] cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.2"/>
          <path d="M2 6h12M8 2v12" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Modules
      </a>

    </div>

    <div class="px-4 py-6 space-y-1">
      <p class="text-[#8FA68C] text-[10px] tracking-[0.3em] uppercase mb-3 px-2">
        Account
      </p>

      <a routerLink="profile"
      class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
        border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
        cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/>
          <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5"
            stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Profile
      </a>

      <a class="flex items-center gap-3 px-2 py-2 text-sm text-[#8FA68C]
        border-l-2 border-transparent hover:text-[#EAE3D5] hover:bg-[#1A3025]
        cursor-pointer transition-all duration-200">
        <svg class="w-4 h-4 opacity-70" viewBox="0 0 16 16" fill="none">
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2"
            stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        Settings
      </a>
    </div>

    <div class="mt-auto px-4 py-4 border-t border-[#2A3D30]">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-[#1A3025] border border-[#2A3D30]
          flex items-center justify-center text-[11px] text-[#C8A96E] font-semibold">
          {{
            user.lastName.charAt(0).toUpperCase()+
            user.firstName.charAt(0).toUpperCase()
          }}
        </div>
        <div>
          <p class="text-sm text-[#EAE3D5]">
          {{
            user.firstName.charAt(0).toUpperCase() +
            user.firstName.substring(1) + "." +
            user.lastName.charAt(0).toUpperCase()
           }}
          </p>
          <p class="text-[11px] text-[#8FA68C]">Student</p>
        </div>
      </div>
    </div>

  </aside>

  <div class="w-full">
    <router-outlet></router-outlet>
  </div>


</div>
