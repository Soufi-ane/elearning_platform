<div class="w-full py-6 pl-9 pr-12 text-left text-[#8FA68C] tracking-wide">
  <div class="flex flex-wrap items-center gap-4 mb-6">
    <button
      type="button"
      (click)="openModal('modules')"
      class="px-4 py-2.5 bg-[#C8A96E] text-[#0E1A14] text-xs font-semibold
        uppercase tracking-wider rounded-sm hover:bg-[#DFC18A]
        transition-colors cursor-pointer">
      + New Module
    </button>
    <button
      type="button"
      (click)="openModal('elements')"
      class="px-4 py-2.5 bg-[#0B1610] text-[#EAE3D5] border border-[#2A3D30]
        hover:border-[#C8A96E] text-xs font-semibold uppercase
        tracking-wider rounded-sm transition-colors cursor-pointer">
      + New Course Element
    </button>
    <button
      type="button"
      (click)="openModal('seances')"
      class="px-4 py-2.5 bg-[#0B1610] text-[#EAE3D5] border border-[#2A3D30]
        hover:border-[#C8A96E] text-xs font-semibold uppercase
        tracking-wider rounded-sm transition-colors cursor-pointer">
      + Schedule Seance
    </button>
  </div>

  @if (activeModal() === 'modules') {
    <div
      (click)="closeModal()"
      class="fixed inset-0 z-50 flex items-center justify-center
        bg-black/75 backdrop-blur-sm p-4">
      <div
        (click)="$event.stopPropagation()"
        class="w-full max-w-lg border border-[#C8A96E]/40 bg-[#0B1610]
          rounded-sm shadow-2xl overflow-hidden">
        <div
          class="px-6 py-4 bg-[#14261C] border-b border-[#2A3D30]
            flex items-center justify-between">
          <div>
            <p class="text-[10px] tracking-[0.25em] uppercase text-[#C8A96E]">
              Curriculum Setup
            </p>
            <h2 class="text-base font-medium text-[#EAE3D5] mt-0.5">
              Create New Module
            </h2>
          </div>
          <button
            type="button"
            (click)="closeModal()"
            class="p-1.5 text-[#8FA68C] hover:text-[#EAE3D5] cursor-pointer">
            ✕
          </button>
        </div>

        <form
          [formGroup]="moduleForm"
          (ngSubmit)="onModuleSubmit()"
          class="p-6 flex flex-col gap-5">
          <div>
            <label
              class="block text-[11px] uppercase tracking-wider
                text-[#8FA68C] mb-2 font-medium">
              Module Name
            </label>
            <input
              formControlName="name"
              type="text"
              placeholder="Enter module name"
              class="w-full bg-[#0E1A14] border border-[#2A3D30]
                text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                focus:border-[#C8A96E] focus:outline-none"/>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Semester
              </label>
              <input
                formControlName="semester"
                type="number"
                min="1"
                max="6"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none"/>
            </div>

            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Department
              </label>
              <select
                formControlName="department"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none cursor-pointer">
                <option value="" disabled>Select department</option>
                <option value="GENIE_INFORMATIQUE">Genie Informatique</option>
                <option value="GENIE_ELECTRIQUE">Genie Electrique</option>
                <option value="GENIE_CIVIL">Genie Civil</option>
              </select>
            </div>
          </div>

          <div
            class="pt-4 border-t border-[#2A3D30] flex justify-end gap-3">
            <button
              type="button"
              (click)="closeModal()"
              class="px-4 py-2 border border-[#2A3D30] bg-[#0E1A14]
                text-[#8FA68C] text-xs uppercase tracking-wider cursor-pointer">
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="moduleForm.invalid"
              class="px-5 py-2 bg-[#C8A96E] text-[#0E1A14] font-semibold
                text-xs uppercase tracking-wider cursor-pointer
                disabled:opacity-40 disabled:cursor-not-allowed">
              Save Module
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  @if (activeModal() === 'elements') {
    <div
      (click)="closeModal()"
      class="fixed inset-0 z-50 flex items-center justify-center
        bg-black/75 backdrop-blur-sm p-4">
      <div
        (click)="$event.stopPropagation()"
        class="w-full max-w-lg border border-[#C8A96E]/40 bg-[#0B1610]
          rounded-sm shadow-2xl overflow-hidden">
        <div
          class="px-6 py-4 bg-[#14261C] border-b border-[#2A3D30]
            flex items-center justify-between">
          <div>
            <p class="text-[10px] tracking-[0.25em] uppercase text-[#C8A96E]">
              Module Component
            </p>
            <h2 class="text-base font-medium text-[#EAE3D5] mt-0.5">
              Create New Course Element
            </h2>
          </div>
          <button
            type="button"
            (click)="closeModal()"
            class="p-1.5 text-[#8FA68C] hover:text-[#EAE3D5] cursor-pointer">
            ✕
          </button>
        </div>

        <form
          [formGroup]="elementForm"
          (ngSubmit)="onElementSubmit()"
          class="p-6 flex flex-col gap-5">
          <div>
            <label
              class="block text-[11px] uppercase tracking-wider
                text-[#8FA68C] mb-2 font-medium">
              Element Name
            </label>
            <input
              formControlName="name"
              type="text"
              placeholder="Enter element name"
              class="w-full bg-[#0E1A14] border border-[#2A3D30]
                text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                focus:border-[#C8A96E] focus:outline-none"/>
          </div>

          <div>
            <label
              class="block text-[11px] uppercase tracking-wider
                text-[#8FA68C] mb-2 font-medium">
              Module
            </label>
            <select
              formControlName="moduleId"
              class="w-full bg-[#0E1A14] border border-[#2A3D30]
                text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                focus:border-[#C8A96E] focus:outline-none cursor-pointer">
              <option value="" disabled>Select a module</option>
              @for (m of modules(); track m.id) {
                <option [value]="m.id">
                  {{ m.name }} (Sem {{ m.semester }})
                </option>
              }
            </select>
          </div>

          <div>
            <label
              class="block text-[11px] uppercase tracking-wider
                text-[#8FA68C] mb-2 font-medium">
              Assigned Teacher
            </label>
            <select
              formControlName="teacherId"
              class="w-full bg-[#0E1A14] border border-[#2A3D30]
                text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                focus:border-[#C8A96E] focus:outline-none cursor-pointer">
              <option value="" disabled>Select an instructor</option>
              @for (t of teachers(); track t.id) {
                <option [value]="t.id">
                  {{ t.firstName }} {{ t.lastName }}
                </option>
              }
            </select>
          </div>

          <div
            class="pt-4 border-t border-[#2A3D30] flex justify-end gap-3">
            <button
              type="button"
              (click)="closeModal()"
              class="px-4 py-2 border border-[#2A3D30] bg-[#0E1A14]
                text-[#8FA68C] text-xs uppercase tracking-wider cursor-pointer">
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="elementForm.invalid"
              class="px-5 py-2 bg-[#C8A96E] text-[#0E1A14] font-semibold
                text-xs uppercase tracking-wider cursor-pointer
                disabled:opacity-40 disabled:cursor-not-allowed">
              Save Element
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  @if (activeModal() === 'seances') {
    <div
      (click)="closeModal()"
      class="fixed inset-0 z-50 flex items-center justify-center
        bg-black/75 backdrop-blur-sm p-4">
      <div
        (click)="$event.stopPropagation()"
        class="w-full max-w-lg border border-[#C8A96E]/40 bg-[#0B1610]
          rounded-sm shadow-2xl overflow-hidden">
        <div
          class="px-6 py-4 bg-[#14261C] border-b border-[#2A3D30]
            flex items-center justify-between">
          <div>
            <p class="text-[10px] tracking-[0.25em] uppercase text-[#C8A96E]">
              Timetable Management
            </p>
            <h2 class="text-base font-medium text-[#EAE3D5] mt-0.5">
              Schedule New Seance
            </h2>
          </div>
          <button
            type="button"
            (click)="closeModal()"
            class="p-1.5 text-[#8FA68C] hover:text-[#EAE3D5] cursor-pointer">
            ✕
          </button>
        </div>

        <form
          [formGroup]="seanceForm"
          (ngSubmit)="onSeanceSubmit()"
          class="p-6 flex flex-col gap-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="col-span-2">
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Course Element
              </label>
              <select
                formControlName="elementId"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none cursor-pointer">
                <option value="" disabled>Select an element</option>
                @for (e of elements(); track e.id) {
                  <option [value]="e.id">{{ e.name }}</option>
                }
              </select>
            </div>

            <div class="col-span-2">
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Room
              </label>
              <select
                formControlName="roomId"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none cursor-pointer">
                <option value="" disabled>Select a room</option>
                @for (r of rooms(); track r.id) {
                  <option [value]="r.id">
                    {{ r.label }} (Campus: {{ r.campus }})
                  </option>
                }
              </select>
            </div>

            <div class="col-span-2">
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Date
              </label>
              <input
                formControlName="date"
                type="date"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none
                  [color-scheme:dark]"/>
            </div>

            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Starts At
              </label>
              <input
                formControlName="startsAt"
                type="time"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none
                  [color-scheme:dark]"/>
            </div>

            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Ends At
              </label>
              <input
                formControlName="endsAt"
                type="time"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none
                  [color-scheme:dark]"/>
            </div>

            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Weekly Repeats
              </label>
              <input
                formControlName="weeklyRepeats"
                type="number"
                min="1"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none"/>
            </div>

            <div>
              <label
                class="block text-[11px] uppercase tracking-wider
                  text-[#8FA68C] mb-2 font-medium">
                Type
              </label>
              <select
                formControlName="type"
                class="w-full bg-[#0E1A14] border border-[#2A3D30]
                  text-[#EAE3D5] px-3.5 py-2.5 text-sm rounded-sm
                  focus:border-[#C8A96E] focus:outline-none cursor-pointer">
                <option value="" disabled>Select session type</option>
                <option value="LECTURE">Lecture</option>
                <option value="EXAM">Exam</option>
              </select>
            </div>
          </div>

          <div
            class="pt-4 border-t border-[#2A3D30] flex justify-end gap-3">
            <button
              type="button"
              (click)="closeModal()"
              class="px-4 py-2 border border-[#2A3D30] bg-[#0E1A14]
                text-[#8FA68C] text-xs uppercase tracking-wider cursor-pointer">
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="seanceForm.invalid"
              class="px-5 py-2 bg-[#C8A96E] text-[#0E1A14] font-semibold
                text-xs uppercase tracking-wider cursor-pointer
                disabled:opacity-40 disabled:cursor-not-allowed">
              Schedule Seance
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
