
<div class="w-full px-4 md:px-8 lg:px-12 pt-24 pb-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
    @for (m of modules; track m.id) {
      <div (click)="onSelect(m.id)"
         class="p-3 border border-[#1A3025] rounded-lg cursor-pointer
            hover:border-[#C8A96E] transition-all bg-[#1A3025]/80
            hover:bg-[#1A3025] flex flex-col justify-between">

        <h3 class="font-semibold text-sm text-[#EAE3D5] leading-tight mb-2">
          {{ m.name }}
        </h3>

        <div class="text-[10px] text-[#8FA68C] font-mono tracking-wider">
          SEMESTER {{ m.semester }}
        </div>
      </div>
    } @empty {
      <p class="text-[#8FA68C] text-sm">No modules available.</p>
    }
  </div>
</div>
